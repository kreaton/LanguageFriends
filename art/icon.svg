<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Language Friends app icon: Freja (Danish) and Omar (Arabic) from the game, greeting each other.
       The kids are copied from the output of Components/Kid.razor (happy mood, without arms).
       Rendered to PNG by tools/make_icons.py. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4dabf7" />
      <stop offset="1" stop-color="#a5d8ff" />
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112" /></clipPath>
  </defs>
  <g id="background">
    <rect width="512" height="512" rx="112" fill="url(#sky)" />
    <path d="M0 430 Q256 370 512 430 V512 H0 Z" fill="#8ce99a" />
  </g>
  <g clip-path="url(#tile)"><g id="content">
