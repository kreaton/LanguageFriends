      <g fill="#c26d4a" opacity=".55"><circle cx="66" cy="120" r="1.6"/><circle cx="72" cy="123" r="1.6"/><circle cx="62" cy="125" r="1.6"/><circle cx="134" cy="120" r="1.6"/><circle cx="128" cy="123" r="1.6"/><circle cx="138" cy="125" r="1.6"/></g>
